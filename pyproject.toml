[project]
name = "agentic-ai-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.22.0",
    "gradio>=6.28.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "openai>=3.8.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
]

[project.scripts]
agentic-ai-labs = "agentic_ai_labs:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
